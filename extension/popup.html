<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e8e8ea;
        background: #18181b;
      }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #757575; flex: none; }
      .dot.ok { background: #43a047; }
      .dot.warn { background: #f9a825; }
      .muted { color: #a1a1aa; }
      .box { border: 1px solid #2f2f35; border-radius: 6px; padding: 8px; margin-top: 8px; }
      button {
        font: inherit;
        color: #fff;
        background: #2b2b31;
        border: 1px solid #3f3f46;
        border-radius: 5px;
        padding: 5px 9px;
        cursor: pointer;
      }
      button:hover { background: #36363d; }
      button.primary { background: #1565c0; border-color: #1565c0; }
      button:disabled { opacity: 0.45; cursor: default; }
      .stack { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
      .stack button { width: 100%; padding: 8px 12px; }
      label { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; color: #a1a1aa; }
      input, select {
        font: inherit;
        color: #e8e8ea;
        background: #101013;
        border: 1px solid #3f3f46;
        border-radius: 4px;
        padding: 4px 6px;
      }
      .pair { display: flex; gap: 6px; }
      .pair label { flex: 1; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      #filters { max-height: 360px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Scrap Download</h1>
    <div class="row"><span id="appDot" class="dot"></span><span id="appText">Checking app…</span></div>
    <div class="row"><span id="sitesDot" class="dot"></span><span id="sitesText"></span></div>
    <div class="stack" id="actions" hidden>
      <button id="downloadFile" class="primary" type="button">Download this file</button>
      <button id="downloadPage" type="button">Download this page</button>
    </div>
    <div id="filters" hidden>
      <label>Tags
        <input id="tags" type="text" placeholder="comma-separated, any site tag" />
      </label>
      <div class="pair">
        <label>Match
          <select id="tagMode">
            <option value="and">AND</option>
            <option value="or">OR</option>
          </select>
        </label>
        <label>Type
          <select id="mediaType">
            <option value="">All</option>
            <option value="image">Images</option>
            <option value="gif">GIFs</option>
            <option value="video">Videos</option>
          </select>
        </label>
      </div>
      <label>Exclude tags
        <input id="exclude" type="text" placeholder="comma-separated" />
      </label>
      <div class="pair">
        <label>From
          <input id="dateFrom" type="datetime-local" />
        </label>
        <label>To
          <input id="dateTo" type="datetime-local" />
        </label>
      </div>
      <div class="pair">
        <label>Sort
          <select id="sort">
            <option value="date_desc">Latest</option>
            <option value="date_asc">Oldest</option>
          </select>
        </label>
        <label>Max files
          <input id="limit" type="number" min="0" value="10" />
        </label>
      </div>
      <div class="stack">
        <button id="runFilters" class="primary" type="button">Run scrape</button>
      </div>
    </div>
    <div id="pageText" class="muted"></div>
    <div class="box">
      <div id="jobText" class="muted">No scrape running.</div>
    </div>
    <div class="actions">
      <button id="refresh" type="button">Reload sites</button>
      <button id="viewer" type="button">Open viewer</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
