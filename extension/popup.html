<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 340px;
        box-sizing: border-box;
        margin: 0;
        padding: 12px;
        overflow-x: hidden;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e8e8ea;
        background: #18181b;
      }
      /* Only the supported gallery / Download this page filters need extra height. */
      body.gallery-filters {
        min-height: 560px;
      }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
      .sites-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
      .sites-row #sitesText { flex: 1; min-width: 0; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #757575; flex: none; }
      .dot.ok { background: #43a047; }
      .dot.warn { background: #f9a825; }
      .muted { color: #a1a1aa; }
      #pageText, #mediaStatus, #hotkeyText, #sitesText {
        margin-top: 6px;
        font-size: 12px;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      #mediaStatus { color: #c4c4cc; }
      #hotkeyActions button { white-space: normal; line-height: 1.3; }
      .box { border: 1px solid #2f2f35; border-radius: 6px; padding: 8px; margin-top: 8px; }
      button {
        font: inherit;
        color: #fff;
        background: #2b2b31;
        border: 1px solid #3f3f46;
        border-radius: 5px;
        padding: 5px 9px;
        cursor: pointer;
      }
      button:hover { background: #36363d; }
      button.primary { background: #1565c0; border-color: #1565c0; }
      button:disabled { opacity: 0.45; cursor: default; }
      .stack { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
      .stack button { width: 100%; padding: 8px 12px; }
      label { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; color: #a1a1aa; min-width: 0; }
      input, select {
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        font: inherit;
        color: #e8e8ea;
        background: #101013;
        border: 1px solid #3f3f46;
        border-radius: 4px;
        padding: 4px 6px;
      }
      .pair { display: flex; gap: 6px; min-width: 0; }
      .pair label { flex: 1 1 0; }
      .when { display: flex; gap: 4px; min-width: 0; }
      .when input[type="date"] { flex: 1.35 1 0; font-size: 11px; padding: 3px 4px; }
      .when input[type="time"] { flex: 1 1 0; font-size: 11px; padding: 3px 4px; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      #filters { max-height: 360px; overflow-x: hidden; overflow-y: auto; }
      details.queue { margin-top: 8px; }
      details.queue summary { cursor: pointer; }
      #queueList { margin: 6px 0 0; padding-left: 16px; max-height: 140px; overflow: auto; word-break: break-all; }
      #queueList a { color: #fff; }
      #pageFilesList {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        max-height: 180px;
        overflow: auto;
      }
      #pageFilesList li {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 2px 0;
      }
      #pageFilesList .file-thumb {
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 4px;
        overflow: hidden;
        background: #101013;
        border: 1px solid #3f3f46;
      }
      #pageFilesList .file-thumb img,
      #pageFilesList .file-thumb video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
      }
      #pageFilesList .file-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button.save-file {
        flex: none;
        width: 26px;
        height: 26px;
        padding: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      button.icon-sync {
        flex: none;
        width: 18px;
        height: 18px;
        padding: 1px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      button.icon-sync svg { display: block; }
    </style>
  </head>
  <body>
    <h1>MediaViewer</h1>
    <div class="row"><span id="appDot" class="dot"></span><span id="appText">Checking app…</span></div>
    <div class="sites-row">
      <span id="sitesDot" class="dot"></span>
      <span id="sitesText"></span>
      <button id="syncSites" class="icon-sync" type="button" title="Sync sites" aria-label="Sync sites">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
          <path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
        </svg>
      </button>
    </div>
    <div class="stack" id="actions" hidden>
      <button id="downloadFile" class="primary" type="button">Download this file</button>
      <button id="downloadPage" type="button">Download this page</button>
    </div>
    <div id="pageText" class="muted"></div>
    <div id="mediaStatus" class="muted" hidden></div>
    <div id="hotkeyText" class="muted"></div>
    <details id="pageFiles" class="queue" hidden>
      <summary id="pageFilesSummary">Files on this page</summary>
      <ul id="pageFilesList"></ul>
    </details>
    <details id="queueBox" class="queue" hidden>
      <summary id="queueSummary">Queue</summary>
      <ul id="queueList"></ul>
    </details>
    <div id="filters" hidden>
      <label>Tags
        <input id="tags" type="text" placeholder="comma-separated, any site tag" />
      </label>
      <div class="pair">
        <label>Match
          <select id="tagMode">
            <option value="and">AND</option>
            <option value="or">OR</option>
          </select>
        </label>
        <label>Type
          <select id="mediaType">
            <option value="">All</option>
            <option value="image">Images</option>
            <option value="gif">GIFs</option>
            <option value="video">Videos</option>
          </select>
        </label>
      </div>
      <label>Exclude tags
        <input id="exclude" type="text" placeholder="comma-separated" />
      </label>
      <div class="pair">
        <label>From
          <div class="when">
            <input id="dateFrom" type="date" />
            <input id="timeFrom" type="time" />
          </div>
        </label>
        <label>To
          <div class="when">
            <input id="dateTo" type="date" />
            <input id="timeTo" type="time" />
          </div>
        </label>
      </div>
      <div class="pair">
        <label>Sort
          <select id="sort">
            <option value="date_desc">Latest</option>
            <option value="date_asc">Oldest</option>
          </select>
        </label>
        <label>Max files
          <input id="limit" type="number" min="0" value="10" />
        </label>
      </div>
      <div class="stack">
        <button id="runFilters" class="primary" type="button">Run scrape</button>
      </div>
    </div>
    <div class="box">
      <div id="jobText" class="muted">No scrape running.</div>
    </div>
    <div class="actions">
      <button id="extensionSettings" type="button">Extension settings</button>
      <button id="viewer" type="button">Open viewer</button>
    </div>
    <script src="hotkeySettings.js"></script>
    <script src="iconProgress.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
